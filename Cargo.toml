[workspace]
members = [
    "crates/util",
    "crates/tls",
    "crates/admin",
    "crates/client",
    "crates/cli",
    "crates/config",
    "crates/wire",
    "crates/protocol",
    "crates/common",
    "crates/broker",
    "crates/fibril",
    "crates/metrics",
    "crates/tui-example",
    "crates/coordination-ganglion",
    "crates/compat-fixture-gen",
    "crates/demo",
    "benches",
]

resolver = "3"

# All crates in this repo share one version and move in lockstep, inheriting it
# via `version.workspace = true`, and share one license and repository the same
# way. Ganglion and Keratin are separate repos that carry their own version lines.
[workspace.package]
version = "0.4.0"
license = "MIT"
repository = "https://github.com/Axmouth/fibril"
homepage = "https://fibril.sh"
authors = ["Axmouth"]

# Crates published to crates.io name their in-repo dependencies here with both
# a path and a version, since crates.io rejects path-only dependencies.
# scripts/release.sh bumps these versions with the workspace version.
[workspace.dependencies]
fibril-common = { path = "crates/common", version = "0.4.0" }
fibril-util = { path = "crates/util", version = "0.4.0" }
fibril-wire = { path = "crates/wire", version = "0.4.0" }
stroma-common = { git = "https://github.com/Axmouth/keratin.git", branch = "main", version = "0.1.0" }

[workspace.metadata.sovereignty]
ai-training = "prohibited"
policy-url = "https://github.com/axmouth/fibril/blob/main/AI_POLICY.md"

# Local development uses the sibling Keratin checkout while committed
# dependency lines stay git-sourced for CI, Docker, and release builds.
[patch."https://github.com/Axmouth/keratin.git"]
stroma-core = { path = "../keratin/stroma/core" }
stroma-common = { path = "../keratin/stroma/common" }
keratin-log = { path = "../keratin/keratin-log" }

[patch."https://github.com/Axmouth/ganglion.git"]
ganglion-core = { path = "../ganglion/crates/ganglion-core" }
ganglion-openraft = { path = "../ganglion/crates/ganglion-openraft" }
ganglion = { path = "../ganglion/crates/ganglion" }
