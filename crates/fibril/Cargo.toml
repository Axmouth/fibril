[package]
name = "fibril"
version.workspace = true
edition = "2024"
description = "The Fibril message broker server binary and embedding library"
license.workspace = true
repository.workspace = true

[[bin]]
name = "fibril-server"
path = "bin/server.rs"

[dependencies]
fibril-admin = { path = "../admin" }
fibril-broker = { path = "../broker" }
fibril-config = { path = "../config" }
fibril-protocol = { path = "../protocol" }
fibril-metrics = { path = "../metrics" }
fibril-tls = { path = "../tls" }
fibril-util = { path = "../util" }
fibril-coordination-ganglion = { path = "../coordination-ganglion" }
ganglion-core = { git = "https://github.com/Axmouth/ganglion.git", branch = "main" }
ganglion = { git = "https://github.com/Axmouth/ganglion.git", branch = "main" }
anyhow = "1.0"
async-trait = "0.1"
fastrand = "2"
futures = "0.3"
mimalloc = { version = "0.1" }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-error = "0.2"
uuid = { version = "1.19", features = ["v4"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"

[dev-dependencies]
keratin-log = { git = "https://github.com/Axmouth/keratin.git", branch = "main" }
fibril-client = { path = "../client" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[features]
writer-stage-trace = ["fibril-broker/writer-stage-trace"]
io-fault-injection = ["keratin-log/io-fault-injection"]
early-replication-experiment = ["fibril-broker/early-replication-experiment"]
# Compatibility with existing benchmark build commands; routing is now enabled by default.
targeted-routing-experiment = []
ordered-queue-apply-experiment = ["fibril-broker/ordered-queue-apply-experiment"]

[package.metadata.ai]
training = "prohibited"
