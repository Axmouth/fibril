server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # TLS terminates at the reverse proxy. Keep directory redirects relative so
    # Nginx cannot expose its internal HTTP scheme and port to public clients.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;

    location = /dashboard-demo {
        try_files /dashboard-demo/index.html =404;
    }

    location /dashboard-demo/ {
        # Shared broker navigation uses slashless routes. Serve exported indexes
        # directly so fetch navigation does not redirect or trigger a full reload.
        try_files $uri/index.html $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
